<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BMI 計算器</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; font-family: system-ui, -apple-system, "Noto Sans TC", sans-serif;
      color: #17251f; background: linear-gradient(145deg, #e8f4ec, #f7f8f1 55%, #dcece1);
    }
    .card {
      width: min(100%, 440px); padding: 34px; border-radius: 24px;
      background: rgba(255,255,255,.92); box-shadow: 0 18px 60px #294b3620;
    }
    .eyebrow { color: #4d8b68; font-weight: 700; letter-spacing: .12em; font-size: 12px; }
    h1 { margin: 8px 0; font-size: 30px; }
    .intro { color: #718078; margin: 0 0 26px; line-height: 1.6; }
    label { display: block; margin: 18px 0 8px; font-weight: 650; font-size: 14px; }
    .input-wrap { position: relative; }
    input {
      width: 100%; height: 54px; border: 1px solid #d8e2db; border-radius: 12px;
      padding: 0 56px 0 16px; font-size: 17px; outline: none; background: #fbfdfb;
      transition: border .2s, box-shadow .2s;
    }
    input:focus { border-color: #55a574; box-shadow: 0 0 0 4px #55a57420; }
    .unit { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: #7e8b83; }
    button {
      width: 100%; height: 54px; border: 0; border-radius: 12px; margin-top: 24px;
      color: white; background: #347b51; font-size: 16px; font-weight: 700; cursor: pointer;
      transition: background .2s, transform .2s;
    }
    button:hover { background: #286641; transform: translateY(-1px); }
    button:focus-visible { outline: 3px solid #9bc9a9; outline-offset: 3px; }
    .result { display: none; margin-top: 22px; padding: 20px; border-radius: 16px; background: #eef6ef; text-align: center; }
    .result.show { display: block; }
    .result-label { color: #728078; font-size: 13px; }
    .number { font-size: 48px; line-height: 1.15; font-weight: 750; color: #286641; margin: 5px 0; }
    .category { font-weight: 700; }
    .note { color: #718078; font-size: 12px; margin: 17px 0 0; line-height: 1.6; }
    .error { color: #b42318; font-size: 13px; margin: 10px 0 0; min-height: 18px; }
    @media (max-width: 480px) { .card { padding: 26px 22px; } }
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">健康小工具</div>
    <h1>BMI 計算器</h1>
    <p class="intro">輸入身高與體重，快速計算你的身體質量指數。</p>
    <form id="bmi-form" novalidate>
      <label for="height">身高</label>
      <div class="input-wrap"><input id="height" type="number" inputmode="decimal" min="50" max="250" step="0.1" placeholder="例如 170" required><span class="unit">公分</span></div>
      <label for="weight">體重</label>
      <div class="input-wrap"><input id="weight" type="number" inputmode="decimal" min="10" max="500" step="0.1" placeholder="例如 65" required><span class="unit">公斤</span></div>
      <p class="error" id="error" role="alert"></p>
      <button type="submit">計算 BMI</button>
    </form>
    <section class="result" id="result" aria-live="polite">
      <div class="result-label">你的 BMI</div>
      <div class="number" id="bmi-value">—</div>
      <div class="category" id="category"></div>
    </section>
    <p class="note">BMI 僅供健康管理參考，無法取代醫療診斷；兒童、孕婦及運動員等族群，建議諮詢專業醫療人員。</p>
  </main>
  <script>
    const form = document.querySelector('#bmi-form');
    const heightInput = document.querySelector('#height');
    const weightInput = document.querySelector('#weight');
    const result = document.querySelector('#result');
    const error = document.querySelector('#error');

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const heightCm = Number(heightInput.value);
      const weightKg = Number(weightInput.value);
      if (!heightCm || !weightKg || heightCm < 50 || heightCm > 250 || weightKg < 10 || weightKg > 500) {
        error.textContent = '請輸入有效數值（身高 50–250 公分、體重 10–500 公斤）。';
        result.classList.remove('show');
        return;
      }
      error.textContent = '';
      const bmi = weightKg / ((heightCm / 100) ** 2);
      let category;
      if (bmi < 18.5) category = '體重過輕';
      else if (bmi < 24) category = '健康體位';
      else if (bmi < 27) category = '體重過重';
      else if (bmi < 30) category = '輕度肥胖';
      else if (bmi < 35) category = '中度肥胖';
      else category = '重度肥胖';
      document.querySelector('#bmi-value').textContent = bmi.toFixed(1);
      document.querySelector('#category').textContent = category;
      result.classList.add('show');
    });
  </script>
</body>
</html>
